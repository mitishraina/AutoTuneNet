# AutoTuneNet configuration. Every key is optional except parameter_space.
parameter_space:
  lr: {low: 1e-4, high: 1e-1, log: true}       # continuous, log scale
  weight_decay: {low: 1e-6, high: 1e-3, log: true}
tuning:
  tune_n_steps: 1          # tune on every call
  warmup_epochs: 2         # calls before tuning starts
  max_delta: 0.5           # at most ±50% change per tuning step
search:
  n_startup_trials: 3      # random proposals before TPE uses its model
metrics:
  smoothing_window: 3
stability:
  max_regression: 0.2
  patience: 2
  cooldown: 3
