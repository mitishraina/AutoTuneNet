task: cifar10
seed: 42

training:
  batch_size: 128
  epochs: 10
  initial_lr: 0.001

controller:
  type: autotunenet

  parameter_space:
    lr: {low: 1e-4, high: 1e-3, log: true}
    momentum: [0.8, 0.99]
    weight_decay: [1e-4, 5e-4]

  search:
    # TPE samples at random for this many trials before using its model.
    # A 10-epoch run has at most 8 tuning steps, so Optuna's default (10)
    # would make every proposal random.
    n_startup_trials: 3

  tuning:
    tune_n_steps: 1
    warmup_epochs: 2
    max_delta: 0.5

  metrics:
    smoothing_window: 3

  stability:
    max_regression: 0.2
    patience: 2
    cooldown: 3

non_stationarity:
  type: label_noise
  start_epoch: 5
  noise_ratio: 0.3
