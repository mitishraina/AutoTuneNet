task: mnist

training:
  epochs: 10
  batch_size: 64
  initial_lr: 0.01
  seed: 42

controller:
  type: autotunenet
  parameter_space:
    lr: {low: 1e-4, high: 1e-1, log: true}
  search:
    # TPE samples at random for this many trials before using its model.
    # A 10-epoch run has at most 8 tuning steps, so Optuna's default (10)
    # would make every proposal random.
    n_startup_trials: 3

  tuning:
    tune_n_steps: 1
    warmup_epochs: 2
    max_delta: 0.5

non_stationarity:
  type: label_noise
  start_epoch: 5
  noise_ratio: 0.3
