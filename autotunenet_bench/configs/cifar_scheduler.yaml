task: cifar10
seed: 42

training:
  batch_size: 128
  epochs: 10
  initial_lr: 0.001

controller:
  type: scheduler

  scheduler:
    name: cosine
    T_max: 10

  parameter_space:
    lr: [0.001, 0.001]

  metrics:
    smoothing_window: 1

non_stationarity:
  type: label_noise
  start_epoch: 5
  noise_ratio: 0.3
