task: mnist
seed: 42

training:
  batch_size: 64
  epochs: 10
  initial_lr: 0.01

controller:
  type: scheduler

  scheduler:
    name: cosine
    T_max: 10

  parameter_space:
    lr: [0.01, 0.01]

  metrics:
    smoothing_window: 1

non_stationarity:
  type: gradient_noise
  start_epoch: 5
  std: 0.02
  seed: 42
