parameter_space:
  lr: {low: 0.001, high: 0.1, log: true}
  weight_decay: {low: 0.0001, high: 0.01, log: true}

tuning:
  tune_n_steps: 1
  warmup_epochs: 2
  warmup_metric_threshold: -0.2
  max_delta: 0.5

metrics:
  smoothing_window: 5

stability:
  max_regression: 0.2
  patience: 2
  cooldown: 3
search:
  n_startup_trials: 10
