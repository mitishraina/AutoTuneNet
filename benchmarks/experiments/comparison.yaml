# AutoTuneNet vs. other learning-rate strategies.
#   uv run python -m benchmarks.run --experiment benchmarks/experiments/comparison.yaml
name: comparison
epochs: 10
seeds: [42, 43, 44]
tasks: [mnist, cifar10]

scenarios:
  stationary: {}
  label_noise: {start_epoch: 5, noise_ratio: 0.3}            # 30% of training labels randomised
  gradient_noise: {start_epoch: 5, std: 0.02, tasks: [mnist]} # noise added to every gradient
  bad_initial_lr: {initial_lr: 0.1}                          # stress test

# Each method's keyword arguments. All tuning methods search the task's lr_range on a log scale.
methods:
  fixed_lr: {}
  cosine: {}
  autotunenet:
    n_startup_trials: 3
    warmup_epochs: 2
    max_delta: 0.5
    smoothing_window: 3
    max_regression: 0.2
    patience: 2
    cooldown: 3
