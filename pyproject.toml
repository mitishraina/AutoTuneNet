[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autotunenet"
version = "1.0.2"
authors = [
    { name = "Mitish Raina", email = "mitishraina.dev@gmail.com"}
]
description = "Online Hyperparameter Adaptation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "optuna",
    "torch",
    "torchvision",
    "pyyaml"
]

[project.optional-dependencies]
# pip install "autotunenet[bench]": PBT (Ray Tune), the Kaggle runtime, and report figures.
bench = [
    "kaggle>=1.7.4.5",
    "ray[tune]>=2.60.0",
    "six>=1.17.0",          # kaggle 2.2.x imports it without declaring it
    "matplotlib>=3.10.9",
]

[project.scripts]
autotunenet = "autotunenet.cli:main"

[dependency-groups]
dev = [
    "autotunenet[bench]",
    "pytest>=8",
    "black",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/mitishraina/AutoTuneNet"
Repository = "https://github.com/mitishraina/AutoTuneNet"
Issues = "https://github.com/mitishraina/AutoTuneNet/issues"

[tool.uv]
# `uv sync` installs the development tools and the `bench` extra, so contributors get everything.
# `pip install autotunenet` installs the library and the CLI; add [bench] for PBT, Kaggle and figures.
default-groups = ["dev"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
autotunenet = ["config/*.yaml", "bench/experiments/*.yaml"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.tests", "*.tests.*", "*_test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repo root on sys.path so tests can import the benchmark harness
# (autotunenet_bench, benchmarks), which is not part of the installed package.
pythonpath = ["."]
